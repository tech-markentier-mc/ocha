<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocha — A Minecraft mod about Tea</title>
    <meta name="description" content="Ocha — a Minecraft mod about tea.">
    <meta name="theme-color" content="#f4f1e7">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <img class="landscape" src="assets/landscape.svg" aria-hidden="true">
        <div class="wrap">
            <main>
                <section class="hero" aria-labelledby="title">
                    <div class="intro">
                        <h1 id="title">Ocha<img class="tea-logo" src="assets/tea-cup.svg" aria-hidden="true"></h1>
                        <p class="subtitle">A Minecraft mod about tea</p>
                    </div>
                    <div class="tea-scene">
                        <img class="tea-art" src="assets/tea-scene.svg" aria-hidden="true">
                        <p class="poem" lang="ja">一人茶や蝶は毎日来てくれる</p>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
