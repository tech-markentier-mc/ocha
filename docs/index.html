<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <meta name="text-scale" content="scale">
    <title>Ocha — A Minecraft mod about Tea</title>
    <meta name="description" content="Ocha — a Minecraft mod about tea.">
    <link rel="icon" type="image/svg+xml" href="assets/tea-cup.svg">
    <meta name="theme-color" content="#f4f1e7">
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <img class="landscape" src="assets/landscape.svg" alt="Soft green hills traced with gently flowing contour lines.">
        <div class="wrap">
            <main>
                <section class="hero" aria-labelledby="title">
                    <div class="intro">
                        <h1 id="title"><span class="title-ghost" lang="ja" aria-hidden="true">お茶</span>Ocha<img class="tea-logo" src="assets/tea-cup.svg" alt="A steaming green teacup on a saucer."></h1>
                        <p class="subtitle">A Minecraft mod about tea</p>
                    </div>
                    <div class="tea-scene">
                        <img class="tea-art" src="assets/tea-scene.svg" alt="A steaming bowl of green tea beside a leafy tea branch, with a butterfly hovering against a pale sun.">
                        <p class="poem" lang="ja">一人茶や 蝶は毎日 来てくれる</p>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
